<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cocktail.name }} - Recommendation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f6f4ee;
            font-family: 'Noto Serif KR', serif, -apple-system;
            color: #2b2b2b;
            line-height: 1.6;
            min-height: 100vh;
            padding: 24px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-nav {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 24px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .mood-label {
            max-width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-link {
            color: #111;
            text-decoration: underline;
            font-size: 0.8rem;
        }

        .result-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-header {
            width: 100%;
            margin-bottom: 24px;
            text-align: left;
        }

        .brand-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 400;
            line-height: 1.25;
            color: #1a1a1a;
        }

        .image-wrapper {
            width: 220px;
            height: 220px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cocktail-img {
            max-width: 220px !important;
            max-height: 220px !important;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }

        .cocktail-detail {
            width: 100%;
            text-align: center;
        }

        .cocktail-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .cocktail-category {
            font-size: 0.78rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 20px;
        }

        .recommend-reason {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #333;
            margin-bottom: 24px;
            word-break: keep-all;
            padding: 0 8px;
        }

        .recipe-box {
            text-align: left;
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e5e0d3;
            margin-bottom: 28px;
        }

        .recipe-box h4 {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: #222;
        }

        .ingredient-list {
            list-style: square inside;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .instructions-text {
            font-size: 0.85rem;
            color: #555;
            line-height: 1.6;
            word-break: keep-all;
        }

        .btn-retry {
            display: inline-block;
            padding: 10px 24px;
            background: #1a1a1a;
            color: #f6f4ee;
            text-decoration: none;
            font-size: 0.85rem;
            border-radius: 6px;
        }
    </style>
</head>
<body style="background-color: #f6f4ee; margin: 0; padding: 24px 20px 60px; display: flex; flex-direction: column; align-items: center;">
    
    <nav class="top-nav" style="width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <span class="mood-label">MOOD: "{{ mood }}"</span>
        <a href="/" class="nav-link">다시 기록하기</a>
    </nav>

    <main class="result-container" style="width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center;">
        <header class="brand-header" style="width: 100%; margin-bottom: 24px;">
            <h1 style="font-size: 1.7rem; font-weight: 400; color: #1a1a1a;"><strong>BAR</strong> pours stories (and drinks).</h1>
        </header>

        <!-- 이미지 태그에 크기 강제 인라인 스타일 부여 -->
        <div class="image-wrapper" style="width: 220px; height: 220px; margin-bottom: 24px; display: flex; justify-content: center; align-items: center;">
            <img src="{{ cocktail.image }}" alt="{{ cocktail.name }}" class="cocktail-img" style="max-width: 220px; max-height: 220px; width: auto; height: auto; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.12);">
        </div>

        <section class="cocktail-detail" style="width: 100%; text-align: center;">
            <h2 class="cocktail-title" style="font-size: 1.8rem; margin-bottom: 4px;">{{ cocktail.name }}</h2>
            <p class="cocktail-category" style="font-size: 0.78rem; letter-spacing: 1px; color: #777; margin-bottom: 20px;">{{ cocktail.category }} / {{ cocktail.glass }}</p>
            
            <p class="recommend-reason" style="font-size: 0.95rem; line-height: 1.7; color: #333; margin-bottom: 24px; word-break: keep-all;">
                "{{ reason }}"
            </p>

            <div class="recipe-box" style="text-align: left; background: rgba(255, 255, 255, 0.7); padding: 20px; border-radius: 10px; border: 1px solid #e5e0d3; margin-bottom: 28px;">
                <h4 style="font-size: 0.82rem; text-transform: uppercase; margin-bottom: 8px;">Ingredients</h4>
                <ul class="ingredient-list" style="margin-bottom: 16px; font-size: 0.85rem; color: #555;">
                    {% for item in cocktail.ingredients %}
                        <li>{{ item }}</li>
                    {% endfor %}
                </ul>

                <h4 style="font-size: 0.82rem; text-transform: uppercase; margin-bottom: 8px;">Instructions</h4>
                <p class="instructions-text" style="font-size: 0.85rem; color: #555; line-height: 1.6;">{{ cocktail.instructions }}</p>
            </div>

            <div class="action-footer">
                <a href="/" class="btn-retry" style="display: inline-block; padding: 10px 24px; background: #1a1a1a; color: #f6f4ee; text-decoration: none; font-size: 0.85rem; border-radius: 6px;">다른 기분 입력하기</a>
            </div>
        </section>
    </main>
</body>
</html>
