<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기분의 기록 - 오늘의 잔</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            font-family: 'Noto Serif KR', -apple-system, serif;
            color: #2b2b2b;
            background-color: #f7f7f4;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-section h2 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .header-section p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #666;
            word-break: keep-all;
        }

        .memo-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06), 0 3px 10px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 미니멀 API 키 입력 영역 */
        .api-key-box {
            padding: 12px 20px;
            background: #fafaf9;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .api-key-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #888;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .api-key-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.82rem;
            color: #333;
            outline: none;
            font-family: monospace;
        }

        .api-key-input::placeholder {
            color: #bbb;
            font-family: 'Noto Serif KR', serif;
        }

        .tab-nav {
            display: flex;
            border-bottom: 1px solid #ebebeb;
            background-color: #fcfcfb;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.88rem;
            color: #8c8c8c;
            cursor: pointer;
            outline: none;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #1a1a1a;
            font-weight: 600;
            border-bottom: 2px solid #1a1a1a;
        }

        .tab-content {
            display: none;
            padding: 24px 20px;
        }

        .tab-content.active {
            display: block;
        }

        .form-title {
            font-size: 1.15rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
            color: #1a1a1a;
        }

        .form-subtext {
            font-size: 0.82rem;
            color: #777;
            text-align: center;
            margin-bottom: 20px;
        }

        .memo-textarea {
            width: 100%;
            height: 160px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 14px;
            font-family: 'Noto Serif KR', serif;
            font-size: 0.95rem;
            line-height: 1.7;
            color: #333;
            outline: none;
            background: #fafaf8;
            resize: none;
        }

        .memo-textarea:focus {
            border-color: #aaa;
            background: #ffffff;
        }

        .memo-textarea::placeholder {
            color: #aaa;
        }

        .select-wrapper {
            margin: 16px 0 28px;
        }

        .cocktail-select {
            width: 100%;
            padding: 12px 14px;
            font-family: 'Playfair Display', 'Noto Serif KR', serif;
            font-size: 0.95rem;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafaf8;
            outline: none;
            cursor: pointer;
        }

        .memo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #f3f3f3;
        }

        .char-guide {
            font-size: 0.78rem;
            color: #999;
        }

        .submit-btn {
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            font-size: 0.85rem;
            font-family: inherit;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header-section">
        <h2>기분의 기록</h2>
        <p>온전히 마주하는 오늘의 감정을 적어보세요.<br>당신의 마음에 꼭 맞는 한 잔을 찾아드립니다.</p>
    </div>

    <main class="memo-card">
        <!-- 폼 바로 상단에 노출되는 미니멀한 API Key 입력줄 -->
        <div class="api-key-box">
            <span class="api-key-label">API KEY</span>
            <input 
                type="password" 
                id="main-api-key" 
                class="api-key-input" 
                placeholder="sk-... (입력 시 자동 저장)"
                oninput="saveKey(this.value)">
        </div>

        <nav class="tab-nav">
            <button type="button" class="tab-btn active" onclick="switchTab(event, 'mood-tab')">기분으로 찾기</button>
            <button type="button" class="tab-btn" onclick="switchTab(event, 'cocktail-tab')">칵테일로 찾기</button>
        </nav>

        <!-- 탭 1: 기분 입력 -->
        <div id="mood-tab" class="tab-content active">
            <form action="/recommend" method="POST" onsubmit="attachApiKey(this)">
                <input type="hidden" name="custom_api_key" class="hidden-api-key">
                <h3 class="form-title">어떤 하루를 보내셨나요?</h3>
                <textarea 
                    name="mood" 
                    class="memo-textarea" 
                    placeholder="비가 와서 센치한 저녁이야, 가볍고 상큼한 위로가 필요해..."
                    required></textarea>

                <div class="memo-footer">
                    <span class="char-guide">솔직한 감정을 적어주세요</span>
                    <button type="submit" class="submit-btn">칵테일 찾기</button>
                </div>
            </form>
        </div>

        <!-- 탭 2: 칵테일 선택 -->
        <div id="cocktail-tab" class="tab-content">
            <form action="/recommend-by-cocktail" method="POST" onsubmit="attachApiKey(this)">
                <input type="hidden" name="custom_api_key" class="hidden-api-key">
                <h3 class="form-title">궁금한 칵테일을 골라보세요</h3>
                <p class="form-subtext">이 칵테일이 가장 깊게 어울리는 순간을 찾아드립니다.</p>
                
                <div class="select-wrapper">
                    <select name="cocktail_name" class="cocktail-select" required>
                        <option value="" disabled selected>칵테일을 선택하세요</option>
                        {% for c in cocktails %}
                            <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="memo-footer">
                    <span class="char-guide">바텐더의 추천 노트</span>
                    <button type="submit" class="submit-btn">어울리는 기분 보기</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // 페이지 로드 시 기존에 저장된 키를 불러와서 인풋에 세팅
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('openai_user_key') || '';
            document.getElementById('main-api-key').value = saved;
        });

        // 사용자가 키를 타이핑할 때마다 브라우저 로컬스토리지에 즉시 저장
        function saveKey(val) {
            localStorage.setItem('openai_user_key', val.trim());
        }

        // 탭 전환 로직
        function switchTab(e, tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            e.currentTarget.classList.add('active');
        }

        // 전송 시 저장된 API 키를 폼의 hidden 필드에 전달
        function attachApiKey(formEl) {
            const key = document.getElementById('main-api-key').value.trim();
            formEl.querySelector('.hidden-api-key').value = key;
        }
    </script>
</body>
</html>
