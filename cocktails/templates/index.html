<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기분의 기록 - 오늘의 잔</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            font-family: 'Noto Serif KR', -apple-system, serif;
            color: #2b2b2b;
            background-color: #f7f7f4;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-section h2 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .header-section p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #666;
            word-break: keep-all;
        }

        .memo-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06), 0 3px 10px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tab-nav {
            display: flex;
            border-bottom: 1px solid #ebebeb;
            background-color: #fcfcfb;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.88rem;
            color: #8c8c8c;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #1a1a1a;
            font-weight: 600;
            border-bottom: 2px solid #1a1a1a;
        }

        .tab-content {
            display: none;
            padding: 28px 24px;
        }

        .tab-content.active {
            display: block;
        }

        .form-title {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            color: #1a1a1a;
        }

        .form-subtext {
            font-size: 0.85rem;
            color: #777;
            text-align: center;
            margin-bottom: 24px;
            word-break: keep-all;
        }

        .memo-textarea {
            width: 100%;
            height: 180px;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Noto Serif KR', serif;
            font-size: 0.95rem;
            line-height: 1.8;
            color: #333;
            outline: none;
            background: #fafaf8;
            resize: none;
            transition: border-color 0.2s;
        }

        .memo-textarea:focus {
            border-color: #bbb;
            background: #ffffff;
        }

        .memo-textarea::placeholder {
            color: #aaa;
            line-height: 1.8;
        }

        .select-wrapper {
            margin: 24px 0 32px;
        }

        .cocktail-select {
            width: 100%;
            padding: 14px 16px;
            font-family: 'Playfair Display', 'Noto Serif KR', serif;
            font-size: 1rem;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafaf8;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .cocktail-select:focus {
            border-color: #2b2b2b;
            background: #ffffff;
        }

        .memo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f3f3f3;
        }

        .char-guide {
            font-size: 0.78rem;
            color: #999;
        }

        .submit-btn {
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-family: inherit;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .submit-btn:hover {
            opacity: 0.85;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="header-section">
        <h2>기분의 기록</h2>
        <p>온전히 마주하는 오늘의 감정을 적어보세요.<br>당신의 마음에 꼭 맞는 한 잔을 찾아드립니다.</p>
    </div>

    <main class="memo-card">
        <nav class="tab-nav">
            <button type="button" class="tab-btn active" onclick="switchTab(event, 'mood-tab')">기분으로 찾기</button>
            <button type="button" class="tab-btn" onclick="switchTab(event, 'cocktail-tab')">칵테일로 찾기</button>
        </nav>

        <!-- 탭 1: 기분 입력 폼 -->
        <div id="mood-tab" class="tab-content active">
            <form action="/recommend" method="POST">
                <h3 class="form-title">어떤 하루를 보내셨나요?</h3>
                <textarea 
                    name="mood" 
                    class="memo-textarea" 
                    placeholder="비가 와서 센치한 저녁이야, 가볍고 상큼한 위로가 필요해..."
                    required></textarea>

                <div class="memo-footer">
                    <span class="char-guide">솔직한 감정을 적어주세요</span>
                    <button type="submit" class="submit-btn">칵테일 찾기</button>
                </div>
            </form>
        </div>

        <!-- 탭 2: 칵테일 선택 폼 -->
        <div id="cocktail-tab" class="tab-content">
            <form action="/recommend-by-cocktail" method="POST">
                <h3 class="form-title">궁금한 칵테일을 골라보세요</h3>
                <p class="form-subtext">이 칵테일이 가장 깊게 어울리는 순간을 찾아드립니다.</p>
                
                <div class="select-wrapper">
                    <select name="cocktail_name" class="cocktail-select" required>
                        <option value="" disabled selected>칵테일을 선택하세요</option>
                        {% for c in cocktails %}
                            <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="memo-footer">
                    <span class="char-guide">바텐더의 추천 노트</span>
                    <button type="submit" class="submit-btn">어울리는 기분 보기</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        function switchTab(e, tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            e.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
