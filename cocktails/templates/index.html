<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 기분, 오늘의 잔</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="input-page">
    <div class="header-section">
        <h2>기분의 기록</h2>
        <p>온전히 마주하는 오늘의 감정을 적어보세요.<br>당신의 마음에 꼭 맞는 한 잔을 찾아드립니다.</p>
    </div>

    <main class="memo-container">
        <div class="memo-status-bar">
            <span>TODAY</span>
            <span>BAR</span>
        </div>

        <form action="/recommend" method="POST" class="memo-form">
            <h3 class="memo-title">어떤 하루를 보내셨나요?</h3>
            <textarea 
                name="mood" 
                class="memo-textarea" 
                placeholder="비가 와서 센치한 저녁이야, 가볍고 상큼한 위로가 필요해..."
                required></textarea>

            <div class="memo-footer">
                <span class="char-guide">감정을 자유롭게 적어주세요</span>
                <button type="submit" class="submit-btn">칵테일 찾기</button>
            </div>
        </form>
    </main>
</body>
</html>
